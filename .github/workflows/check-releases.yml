name: Check COPR versions and trigger builds

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: copr-version-check
  cancel-in-progress: false

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    env:
      COPR_WEBHOOKS: ${{ secrets.COPR_WEBHOOKS }}
      COPR_OWNER: ${{ secrets.COPR_OWNER }}
      COPR_PROJECT: ${{ secrets.COPR_PROJECT }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check every project listed in apps.json
        run: |
          set -e
          mkdir -p state

          if ! jq empty apps.json 2>/dev/null; then
            echo "ERROR: apps.json is not valid JSON! Fix it before continuing." >&2
            jq empty apps.json
            exit 1
          fi

          for row in $(jq -c '.[]' apps.json); do
            name=$(echo "$row" | jq -r '.name')
            repo=$(echo "$row" | jq -r '.repo')
            statefile="state/${name}.txt"

            tag=$(curl -sL -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/releases/latest" | jq -r '.tag_name')

            if [ -z "$tag" ] || [ "$tag" = "null" ]; then
              echo "WARNING: could not get version info for $name, skipping."
              continue
            fi

            prev="none"
            [ -f "$statefile" ] && prev=$(cat "$statefile")
            tag_stripped=$(echo "$tag" | sed 's/^v//')

            copr_ver=$(curl -sL "https://copr.fedorainfracloud.org/api_3/package/?ownername=${COPR_OWNER}&projectname=${COPR_PROJECT}&packagename=${name}&with_latest_succeeded_build=True" \
              | jq -r '.builds.latest_succeeded.source_package.version // empty')

            need_trigger=0
            [ "$tag" != "$prev" ] && need_trigger=1
            case "$copr_ver" in
              *"$tag_stripped"*) ;;
              *) echo "    (no successful COPR build for this version yet: '$copr_ver')"; need_trigger=1 ;;
            esac

            if [ "$need_trigger" = "1" ]; then
              echo "==> $name: triggering (github: $tag, copr: ${copr_ver:-none}, recorded: $prev)"
              webhook=$(echo "$COPR_WEBHOOKS" | jq -r --arg n "$name" '.[$n] // empty')

              if [ -n "$webhook" ]; then
                curl -sf -X POST "$webhook" && echo "    webhook triggered."
              else
                echo "    WARNING: no URL for '$name' in the COPR_WEBHOOKS secret!"
              fi

              echo "$tag" > "$statefile"
            else
              echo "==> $name: no change ($tag)"
            fi
          done

      - name: Record the last check time and any version changes
        run: |
          TZ='Europe/Istanbul' date +"%Y-%m-%d %H:%M %Z" > state/.last-check
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "Check: $(TZ='Europe/Istanbul' date +"%Y-%m-%d %H:%M %Z")"
          git push
